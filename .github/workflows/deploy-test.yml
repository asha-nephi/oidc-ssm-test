# Deploys to the TEST EC2 instance whenever the `test` branch is pushed.
# Uses GitHub OIDC to get temporary AWS credentials -- no AWS access key
# secrets stored in this repo at all.

name: Deploy to Test

on:
  push:
    branches: [test]

permissions:
  # This is what lets GitHub issue an OIDC ID token for this job.
  # Without this line, configure-aws-credentials has nothing to send to AWS.
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional but recommended: ties this run to a GitHub "Environment" named
    # `test`. Lets you later add environment-specific secrets or protection
    # rules (e.g. required reviewers) without touching the workflow file.
    environment: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Assume the test-only AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Replace <ACCOUNT_ID> with your AWS account ID.
          # This role's trust policy (iam/trust-policy-test.json) only
          # accepts tokens where sub == this exact repo + "ref:refs/heads/test".
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-deploy-test
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        run: |
          set -e

          # Find the test instance by tag rather than hardcoding an instance ID,
          # so this keeps working if the instance is ever replaced.
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=test" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "No running instance tagged Environment=test was found."
            exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          # Replace the commands below with your real deploy steps
          # (git pull, restart a service, run migrations, etc).
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/app && git pull origin test && echo deployed-$(date)"]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
